version: 2
updates:
  # The CLI's own dependencies. Grouped into one pull request per ecosystem:
  # this is a three-dependency package with a single maintainer, and a
  # separate pull request per bump is noise, not diligence.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      cli-dependencies:
        patterns: ["*"]

  # The docs site is a separate pnpm project with its own lockfile.
  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      site-dependencies:
        patterns: ["*"]

  # Action refs in this repo's own workflows (actions/checkout, setup-node,
  # pnpm/action-setup). A stale pinned action is how a workflow starts
  # failing on a runner change nobody made.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      workflow-actions:
        patterns: ["*"]
